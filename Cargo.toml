[package]
name = "srk-weather-tui"
version = "0.1.0"
edition = "2021"
description = "Cool terminal weather TUI — SRK Master Stack"
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
